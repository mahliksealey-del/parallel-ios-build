name: Parallel Public iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate project and shared scheme
        run: xcodebuild -project Parallel.xcodeproj -list

      - name: Run engine and integration tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Parallel.xcodeproj \
            -scheme Parallel \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned ARM64 iPhone app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Parallel.xcodeproj \
            -scheme Parallel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Inspect unsigned device product
        run: |
          set -euo pipefail
          APP='DerivedData/Build/Products/Release-iphoneos/Parallel.app'
          BINARY="$APP/Parallel"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test -f "$BINARY"
          file "$BINARY"
          lipo -archs "$BINARY" | tr ' ' '\n' | grep -Fx arm64
          if /usr/bin/codesign -dvv "$APP" 2>/dev/null; then
            echo 'Unexpected signature found on unsigned build.' >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'com.example.parallel.phase0'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST" | grep -Fx audio

      - name: Package and record provenance
        run: |
          set -euo pipefail
          bash scripts/package-unsigned.sh \
            DerivedData/Build/Products/Release-iphoneos/Parallel.app \
            Parallel-unsigned.ipa
          IPA_SHA256="$(shasum -a 256 Parallel-unsigned.ipa | awk '{print $1}')"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_image=macos-15"
            echo "developer_dir=$DEVELOPER_DIR"
            echo "ipa_file=Parallel-unsigned.ipa"
            echo "ipa_sha256=$IPA_SHA256"
            echo "workflow_sha256=$(shasum -a 256 .github/workflows/public-build.yml | awk '{print $1}')"
            echo "project_sha256=$(shasum -a 256 Parallel.xcodeproj/project.pbxproj | awk '{print $1}')"
            xcodebuild -version | sed 's/^/xcode=/'
          } > build-provenance.txt
          cat build-provenance.txt

      - name: Upload unsigned build and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Parallel-unsigned-device-build
          path: |
            Parallel-unsigned.ipa
            build-provenance.txt
          if-no-files-found: error
          retention-days: 7
