name: Parallel Public iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - phase3/rea-d01-session-fade-2026-11-20
      - phase3/one-swoop-ci-2026-11-20
      - phase4/clock-sync-supercycle-ci-2026-11-22
      - fix/phase4-minute-groups-go-chime-2026-11-23
      - fix/phase4-time-chunk-go-vs-alignment-2026-11-23
      - feature/parallel-p5-seven-source-fullscreen-2026-11-23
      - fix/parallel-p5-d02-audio-session-2026-11-23

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Initialize and inspect simulator services
        run: |
          set -euo pipefail
          xcrun simctl list > /dev/null
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild \
            -project Parallel.xcodeproj \
            -scheme Parallel \
            -showdestinations

      - name: Validate project and shared scheme
        run: xcodebuild -project Parallel.xcodeproj -list

      - name: Build unsigned ARM64 iPhone app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Parallel.xcodeproj \
            -scheme Parallel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Inspect unsigned device product
        run: |
          set -euo pipefail
          APP='DerivedData/Build/Products/Release-iphoneos/Parallel.app'
          BINARY="$APP/Parallel"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test -f "$BINARY"
          file "$BINARY"
          lipo -archs "$BINARY" | tr ' ' '\n' | grep -Fx arm64
          if /usr/bin/codesign -dvv "$APP" 2>/dev/null; then
            echo 'Unexpected signature found on unsigned build.' >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'com.example.parallel.phase0'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST" | grep -Fx audio

      - name: Select an available iOS simulator
        run: |
          set -euo pipefail
          DEVICES_JSON="$(mktemp)"
          trap 'rm -f "$DEVICES_JSON"' EXIT
          xcrun simctl list devices available -j > "$DEVICES_JSON"

          SELECTED="$(jq -r '
            [(.devices["com.apple.CoreSimulator.SimRuntime.iOS-18-5"] // [])[]
              | select((.isAvailable // true) == true and .name == "iPhone 16 Pro")
              | [.udid, .name, "com.apple.CoreSimulator.SimRuntime.iOS-18-5"]]
            | first // empty
            | @tsv
          ' "$DEVICES_JSON")"

          if [[ -z "$SELECTED" ]]; then
            SELECTED="$(jq -r '
              [.devices | to_entries[] as $runtime
                | $runtime.value[]
                | select((.isAvailable // true) == true and .name == "iPhone 16 Pro")
                | {udid: .udid, name: .name, runtime: $runtime.key}]
              | sort_by(.runtime) | reverse | first // empty
              | [.udid, .name, .runtime] | @tsv
            ' "$DEVICES_JSON")"
          fi

          if [[ -z "$SELECTED" ]]; then
            SELECTED="$(jq -r '
              [.devices | to_entries[] as $runtime
                | select($runtime.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
                | $runtime.value[]
                | select((.isAvailable // true) == true and (.name | startswith("iPhone")))
                | {udid: .udid, name: .name, runtime: $runtime.key}]
              | sort_by(.runtime) | reverse | first // empty
              | [.udid, .name, .runtime] | @tsv
            ' "$DEVICES_JSON")"
          fi

          if [[ -z "$SELECTED" ]]; then
            echo 'No available iOS simulator was discovered after CoreSimulator initialization.' >&2
            exit 1
          fi

          IFS=$'\t' read -r SIMULATOR_UDID SIMULATOR_NAME SIMULATOR_RUNTIME <<< "$SELECTED"
          echo "Selected simulator: $SIMULATOR_NAME ($SIMULATOR_RUNTIME, $SIMULATOR_UDID)"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
          echo "SIMULATOR_RUNTIME=$SIMULATOR_RUNTIME" >> "$GITHUB_ENV"

      - name: Run engine and integration tests
        run: |
          set -euo pipefail
          test -n "$SIMULATOR_UDID"
          xcodebuild test \
            -project Parallel.xcodeproj \
            -scheme Parallel \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run deterministic psychoacoustic package tests
        run: swift test --package-path research/phase3/P3-R01B/SwiftPsychoacousticLab

      - name: Package and record provenance
        run: |
          set -euo pipefail
          bash scripts/package-unsigned.sh \
            DerivedData/Build/Products/Release-iphoneos/Parallel.app \
            Parallel-unsigned.ipa
          IPA_SHA256="$(shasum -a 256 Parallel-unsigned.ipa | awk '{print $1}')"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_image=macos-15"
            echo "developer_dir=$DEVELOPER_DIR"
            echo "simulator_name=$SIMULATOR_NAME"
            echo "simulator_runtime=$SIMULATOR_RUNTIME"
            echo "ipa_file=Parallel-unsigned.ipa"
            echo "ipa_sha256=$IPA_SHA256"
            echo "workflow_sha256=$(shasum -a 256 .github/workflows/public-build.yml | awk '{print $1}')"
            echo "project_sha256=$(shasum -a 256 Parallel.xcodeproj/project.pbxproj | awk '{print $1}')"
            xcodebuild -version | sed 's/^/xcode=/'
          } > build-provenance.txt
          cat build-provenance.txt

      - name: Upload unsigned build and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Parallel-unsigned-device-build
          path: |
            Parallel-unsigned.ipa
            build-provenance.txt
          if-no-files-found: error
          retention-days: 7
